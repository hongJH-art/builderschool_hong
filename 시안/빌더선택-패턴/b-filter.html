<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>패턴 B — 필터 + 작업물 우선 (15~40명)</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
:root { --paper:#F4F1EA; --paper2:#FBF9F4; --ink:#0E0E0C; --lime:#D8FF3D; --muted:#807E74; --muted2:#A6A498;
  --line:#DEDCD0; --mono:"JetBrains Mono",monospace; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Pretendard Variable",Pretendard,sans-serif; background:var(--paper); color:var(--ink);
  line-height:1.6; letter-spacing:-0.01em; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1180px; margin:0 auto; padding:70px 32px 110px; }
.back { text-decoration:none; color:var(--muted); font-size:14px; font-weight:600; }
.back:hover { color:var(--ink); }
h1 { font-size:clamp(32px,4vw,46px); font-weight:800; letter-spacing:-0.05em; margin:22px 0 8px; }
.sub { color:var(--muted); font-size:17px; margin:0 0 14px; }
.note { display:inline-block; background:var(--ink); color:var(--lime); font-size:13px; font-weight:700;
  border-radius:999px; padding:6px 16px; margin-bottom:40px; }
.fbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
.fbar .lb { font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--muted2); margin-right:6px;
  text-transform:uppercase; width:70px; }
.chip { border:1px solid var(--line); background:var(--paper2); border-radius:999px; padding:9px 18px;
  font-family:inherit; font-size:14.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s; }
.chip:hover { border-color:var(--ink); color:var(--ink); }
.chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.cnt { margin:20px 0 26px; font-family:var(--mono); font-size:13px; color:var(--muted); }
.cnt b { color:var(--ink); }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
@media (max-width:1000px){ .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:600px){ .grid { grid-template-columns:1fr; } }
.wc { background:var(--paper2); border:1px solid var(--line); border-radius:20px; overflow:hidden;
  text-decoration:none; color:inherit; display:block; transition:.18s; }
.wc:hover { border-color:var(--ink); transform:translateY(-3px); box-shadow:0 16px 40px rgba(14,14,12,.1); }
.wc .cover { aspect-ratio:16/10; display:flex; align-items:flex-end; padding:18px; color:#fff; position:relative; }
.wc .cover .cat { position:absolute; top:14px; left:14px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.12em; background:rgba(0,0,0,.4); padding:5px 11px; border-radius:999px; }
.wc .cover b { font-size:19px; font-weight:800; letter-spacing:-0.03em; line-height:1.35;
  text-shadow:0 1px 10px rgba(0,0,0,.4); }
.wc .bd { padding:16px 20px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.wc .who { display:flex; align-items:center; gap:10px; }
.wc .who i { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff;
  font-style:normal; font-weight:800; font-size:14px; flex:none; }
.wc .who div b { display:block; font-size:14.5px; font-weight:700; }
.wc .who div span { font-size:12.5px; color:var(--muted); }
.wc .go { font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; }
.wc:hover .go { color:var(--ink); }
.empty { display:none; text-align:center; padding:70px 20px; border:1px dashed var(--line); border-radius:20px;
  color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 패턴 목록</a>
  <h1>작업물로 찾기</h1>
  <p class="sub">만들고 싶은 것과 비슷한 결과물을 먼저 찾으세요 — 담당 빌더가 함께 보입니다.</p>
  <span class="note">패턴 B · 15~40명 규모 — 필터로 좁히고, 작업물에서 빌더로</span>

  <div class="fbar"><span class="lb">유형</span>
    <button class="chip on" data-k="type" data-v="all">전체</button>
    <button class="chip" data-k="type" data-v="landing">랜딩</button>
    <button class="chip" data-k="type" data-v="platform">플랫폼</button>
    <button class="chip" data-k="type" data-v="ai">AI 서비스</button>
    <button class="chip" data-k="type" data-v="app">앱</button>
  </div>
  <div class="fbar"><span class="lb">산업</span>
    <button class="chip on" data-k="ind" data-v="all">전체</button>
    <button class="chip" data-k="ind" data-v="commerce">커머스</button>
    <button class="chip" data-k="ind" data-v="edu">교육</button>
    <button class="chip" data-k="ind" data-v="fin">금융</button>
    <button class="chip" data-k="ind" data-v="b2b">B2B</button>
  </div>

  <p class="cnt"><b id="n">9</b>개 프로젝트</p>
  <div class="grid" id="g"></div>
  <div class="empty" id="e"><b>조건에 맞는 프로젝트가 아직 없어요</b><br>필터를 바꾸거나, 문의로 직접 알려주세요.</div>
</div>
<script>
var works = [
  ['AI 상담 챗봇 구축','ai','b2b','AI Service','유나','AI 서비스 · 프론트엔드','#3E4A5E','linear-gradient(135deg,#2E3A2E,#5B6D4E)'],
  ['수주용 브랜드 랜딩','landing','b2b','Landing','리아','랜딩 · 브랜드','#4E5E56','linear-gradient(135deg,#3E3A32,#6B5E3E)'],
  ['콘텐츠 관리 플랫폼','platform','edu','Platform','도현','플랫폼 · 백엔드','#6B4E3E','linear-gradient(135deg,#32363E,#3E5E5E)'],
  ['토스 미니게임','app','fin','App in Toss','민재','앱 · 크로스플랫폼','#5E4E6B','linear-gradient(135deg,#2E3240,#5E4E6B)'],
  ['문서 검색 RAG 봇','ai','b2b','AI Service','하린','AI 서비스 · 데이터','#5E3E4A','linear-gradient(135deg,#3A2E36,#5E3E4A)'],
  ['구독 커머스 사이트','platform','commerce','Platform','태오','플랫폼 · 풀스택','#3E5E5E','linear-gradient(135deg,#2E3A3A,#4A5E3E)'],
  ['강의 판매 랜딩','landing','edu','Landing','서연','랜딩 · 콘텐츠','#6B5E3E','linear-gradient(135deg,#3E362E,#6B5E3E)'],
  ['셀러 정산 대시보드','platform','commerce','Platform','건우','플랫폼 · 인프라','#464E5E','linear-gradient(135deg,#2E323A,#464E5E)'],
  ['AI 온보딩 도우미','ai','edu','AI Service','예진','AI 서비스 · UX','#5E4E56','linear-gradient(135deg,#36303A,#5E4E56)']
];
var f = { type:'all', ind:'all' };
function render(){
  var list = works.filter(function(w){ return (f.type==='all'||w[1]===f.type) && (f.ind==='all'||w[2]===f.ind); });
  document.getElementById('n').textContent = list.length;
  document.getElementById('e').style.display = list.length ? 'none' : 'block';
  document.getElementById('g').innerHTML = list.map(function(w){
    return '<a class="wc" href="#">'
      + '<div class="cover" style="background:'+w[7]+'"><span class="cat">'+w[3]+'</span><b>'+w[0]+'</b></div>'
      + '<div class="bd"><div class="who"><i style="background:'+w[6]+'">'+w[4][0]+'</i>'
      + '<div><b>빌더 '+w[4]+'</b><span>'+w[5]+'</span></div></div>'
      + '<span class="go">프로필 →</span></div></a>';
  }).join('');
}
document.querySelectorAll('.chip').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('.chip[data-k="'+c.dataset.k+'"]').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on');
    f[c.dataset.k] = c.dataset.v;
    render();
  });
});
render();
</script>
</body>
</html>
